[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/muxfin"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }
clap_complete = "4.5"
indicatif = "0.17"
anyhow = "1"
thiserror = "2"
bytes = "1"
mkv-element = "0.4"
matroska-demuxer = "0.8"
lazy_static = "1.4"
proptest = "1"
tempfile = "3"
criterion = "0.5"

muxfin = { path = "crates/muxfin", version = "0.5.0" }
muxfin-ffi = { path = "crates/muxfin-ffi", version = "0.5.0" }

[profile.release]
lto = "thin"
